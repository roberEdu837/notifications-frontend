@if (!isLoginPage()) {

    <div class="container-fluid">
      <a class="navbar-brand fw-bold" routerLink="/notifications">
        <i class="bi bi-bell-fill me-2 text-warning"></i>Sistema
      </a>

      <div class="d-flex align-items-center gap-3">
        <a routerLink="/simulator" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
          <i class="bi bi-play-circle"></i> Simulador
        </a>
        <button class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1" (click)="onLogout()">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </div>
    </div>
