<form [formGroup]="notificationForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
  <div class="modal-body">

    <!-- Empresa -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Empresa</label>
      <select class="form-select" formControlName="companyId"
        [class.is-invalid]="notificationForm.get('companyId')?.touched && notificationForm.get('companyId')?.invalid">
        <option value="">Selecciona una empresa...</option>
        @for (item of companies(); track item.id) {
        <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <!-- País -->
    <div class="mb-3">
      <label class="form-label fw-semibold">País</label>
      <select class="form-select" formControlName="countryId"
        [class.is-invalid]="notificationForm.get('countryId')?.touched && notificationForm.get('countryId')?.invalid">
        <option value="">Selecciona un país...</option>
        @for (item of countries(); track item.id) {
        <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <!-- Sistema -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Sistema</label>
      <select class="form-select" formControlName="systemId"
        [class.is-invalid]="notificationForm.get('systemId')?.touched && notificationForm.get('systemId')?.invalid">
        <option value="">Selecciona un sistema...</option>
        @for (item of systems(); track item.id) {
        <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <!-- Tipo de Mensaje -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Tipo de Mensaje</label>
      <select class="form-select" formControlName="messageTypeId"
        [class.is-invalid]="notificationForm.get('messageTypeId')?.touched && notificationForm.get('messageTypeId')?.invalid">
        <option value="">Selecciona un tipo de mensaje...</option>
        @for (item of messageTypes(); track item.id) {
        <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <!-- Mensaje -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Mensaje</label>
      <textarea class="form-control" rows="3" formControlName="message"
        [class.is-invalid]="notificationForm.get('message')?.touched && notificationForm.get('message')?.invalid"></textarea>
      @if (notificationForm.get('message')?.touched && notificationForm.get('message')?.invalid) {
      <div class="invalid-feedback">El mensaje es obligatorio (mínimo 5 y máximo 100 caracteres).</div> }
    </div>

    <!-- Duración y Estado -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Duración (segundos)</label>
        <input type="number" class="form-control" formControlName="displayDuration">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Estado</label>
        <select class="form-select" formControlName="status">
          <option value="A">Activo</option>
          <option value="I">Inactivo</option>
        </select>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
      <span class="spinner-border spinner-border-sm me-1"></span> Guardando...
      } @else {
      Guardar
      }
    </button>
  </div>
</form>
