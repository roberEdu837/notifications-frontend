<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="w-100" style="max-width: 360px;">
    
    <h1 class="text-center fw-bold mb-4" style="font-size: 2rem;">Iniciar Sesión</h1>

    @if (errorMessage) {
      <div class="alert alert-danger p-2 text-center mb-3" role="alert">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
      
      <div>
        <input 
          type="text" 
          formControlName="username" 
          placeholder="Enter your email or username"
          class="form-control custom-input"
        />
        @if (loginForm.get('username')?.touched && loginForm.get('username')?.invalid) {
          <span class="text-danger small mt-1 d-block">El usuario es requerido.</span>
        }
      </div>

      <div>
        <input 
          type="password" 
          formControlName="password" 
          placeholder="Password"
          class="form-control custom-input"
        />
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <span class="text-danger small mt-1 d-block">La contraseña es requerida.</span>
        }
      </div>

      <button 
        type="submit" 
        class="btn btn-orange w-100 mt-2 d-flex justify-content-center align-items-center">
        @if (isLoading) {
          <span>Cargando...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>

    </form>
  </div>
</div>
