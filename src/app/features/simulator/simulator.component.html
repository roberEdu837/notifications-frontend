<app-simulator-form-configuration></app-simulator-form-configuration>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-3">
            <div class="bg-orange-subtle text-orange rounded-3 d-flex align-items-center justify-content-center shadow-sm"
                style="width: 48px; height: 48px;">
                <i class="bi bi-bell-fill fs-4"></i>
            </div>
            <div>
                <h3 class="fw-bold m-0 text-dark">Abogados</h3>
                <span class="text-muted small">Gestiona y administra los avisos del sistema</span>
            </div>
        </div>

        <button
            class="btn btn-orange rounded-pill px-4 py-2 d-inline-flex align-items-center gap-2 shadow-sm fw-semibold"
            data-bs-toggle="modal" data-bs-target="#simulatorModal">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>

    <div class="table-responsive bg-white rounded-3 shadow-sm border">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Folio</th>
                    <th class="text-center align-middle">Nombre</th>
                    <th class="text-center align-middle">Correo</th>
                    <th class="text-center align-middle">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (lawyer of lawyers(); track lawyer.id) {
                <tr>
                    <td class="fw-bold">{{ lawyer.id }}</td>
                    <td class="text-center align-middle">{{ lawyer.name }}</td>
                    <td class="text-center align-middle">{{ lawyer.email }}</td>
                    <td class="text-center align-middle">
                        <button
                            class="btn btn-light btn-sm rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm text-secondary"
                            style="width: 36px; height: 36px;" (click)="sendInformationNotification()"
                            title="Enviar correo">
                            <i class="bi bi-envelope-fill"></i>
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="4" class="text-center py-5 bg-white">
                        <i class="bi bi-inbox fs-1 text-muted"></i>
                        <p class="text-muted mt-2 mb-0">No hay registros disponibles</p>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="simulatorModal" tabindex="-1" aria-labelledby="simulatorModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-orange-subtle text-orange rounded-3 d-flex align-items-center justify-content-center"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-person-badge-fill fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title fw-bold text-dark m-0" id="simulatorModalTitle">
                                Nuevo Abogado
                            </h5>
                            <span class="text-muted small">Registra un nuevo perfil en el sistema</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>

                <div class="modal-body px-4 py-3">
                    <app-simulator-form (loadLawyers)="loadLawyers()">
                    </app-simulator-form>
                </div>
            </div>
        </div>
    </div>
</div>
