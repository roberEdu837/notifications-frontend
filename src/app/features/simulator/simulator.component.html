<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold m-0">Abogados</h3>
        <button class="btn btn-outline-primary d-flex align-items-center gap-2" data-bs-toggle="modal"
            data-bs-target="#simulatorModal">
            <i class="bi bi-plus-lg"></i> Nuevo
        </button>
    </div>

    <div class="table-responsive bg-white rounded-3 shadow-sm border">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                </tr>
            </thead>
            <tbody>
                @for (lawyer of lawyers(); track lawyer.id) {
                <tr>
                    <td class="fw-bold">#{{ lawyer.id }}</td>
                    <td>{{ lawyer.name }}</td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="2" class="text-center py-4 text-muted">No hay abogados registrados</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="simulatorModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">
                    Nuevo Abogado
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <app-simulator-form (loadLawyers)="loadLawyers()">

            </app-simulator-form>
        </div>
    </div>
</div>
