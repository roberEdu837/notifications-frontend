<form [formGroup]="simulatorConfigForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
  <div class="modal-body">
    <div class="row g-3 align-items-end">

      <!-- Empresa -->
      <div class="col-12 col-sm-6 col-md-3">
        <label class="form-label small fw-semibold">Empresa</label>
        <select class="form-select form-select-sm" formControlName="companyId"
          [class.is-invalid]="simulatorConfigForm.get('companyId')?.touched && simulatorConfigForm.get('companyId')?.invalid">
          <option value="">Selecciona...</option>
          @for (item of companies(); track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
      </div>

      <!-- País -->
      <div class="col-12 col-sm-6 col-md-3">
        <label class="form-label small fw-semibold">País</label>
        <select class="form-select form-select-sm" formControlName="countryId"
          [class.is-invalid]="simulatorConfigForm.get('countryId')?.touched && simulatorConfigForm.get('countryId')?.invalid">
          <option value="">Selecciona...</option>
          @for (item of countries(); track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
      </div>

      <!-- Sistema -->
      <div class="col-12 col-sm-6 col-md-3">
        <label class="form-label small fw-semibold">Sistema</label>
        <select class="form-select form-select-sm" formControlName="systemId"
          [class.is-invalid]="simulatorConfigForm.get('systemId')?.touched && simulatorConfigForm.get('systemId')?.invalid">
          <option value="">Selecciona...</option>
          @for (item of systems(); track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
      </div>

      <!-- Botón -->
      <div class="col-12 col-sm-6 col-md-2 d-grid">
        <button type="submit" class="btn btn-primary btn-sm">
          Guardar Configuración
        </button>
      </div>

    </div>
  </div>
</form>
