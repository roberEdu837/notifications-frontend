<form [formGroup]="simulatorConfigForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
  <div class="modal-body py-3">
    <div class="row g-3 align-items-end">

      <!-- Empresa -->
      <div class="col-12 col-sm-6 col-md-4">
        <label class="form-label small fw-semibold text-muted mb-1">Empresa</label>
        <select class="form-select py-2 rounded-3" formControlName="companyId"
          [class.is-invalid]="simulatorConfigForm.get('companyId')?.touched && simulatorConfigForm.get('companyId')?.invalid">
          <option value="">Selecciona una empresa...</option>
          @for (item of companies(); track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
      </div>

      <!-- País -->
      <div class="col-12 col-sm-6 col-md-4">
        <label class="form-label small fw-semibold text-muted mb-1">País</label>
        <select class="form-select py-2 rounded-3" formControlName="countryId"
          [class.is-invalid]="simulatorConfigForm.get('countryId')?.touched && simulatorConfigForm.get('countryId')?.invalid">
          <option value="">Selecciona un país...</option>
          @for (item of countries(); track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
      </div>

      <!-- Sistema -->
      <div class="col-12 col-sm-6 col-md-4">
        <label class="form-label small fw-semibold text-muted mb-1">Sistema</label>
        <select class="form-select py-2 rounded-3" formControlName="systemId"
          [class.is-invalid]="simulatorConfigForm.get('systemId')?.touched && simulatorConfigForm.get('systemId')?.invalid">
          <option value="">Selecciona un sistema...</option>
          @for (item of systems(); track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
      </div>

      <!-- Botón de Acción -->
      <div class="col-12 d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-orange rounded-pill px-4 py-2 d-inline-flex align-items-center justify-content-center">
          <i class="bi bi-gear-fill me-2"></i> Configurar
        </button>
      </div>

    </div>
  </div>
</form>
